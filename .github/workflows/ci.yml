name: API Test CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:        # 支持在 Actions 页面手动触发

# 解决 actions/deploy-pages 写入主分支时的权限问题
permissions:
  contents: read
  pages: write
  id-token: write

# 防止同一个 workflow 的旧 run 还在排队时，新 push 又触发新 run 造成部署竞争
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行 pytest 并生成 Allure 原始数据
        run: |
          pytest testcases -q --alluredir=allure-results

      - name: 上传 Allure 原始数据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 7

  # ===== 单独一个 job 负责把 Allure 报告发布到 GitHub Pages =====
  allure-report:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 allure-results 目录
        run: mkdir -p allure-results

      - name: 下载 Allure 原始数据
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: 安装 Allure 命令行
        run: |
          sudo apt-get update
          sudo apt-get install -y allure

      - name: 生成 Allure HTML 报告
        run: |
          allure generate allure-results -o allure-report --clean

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
